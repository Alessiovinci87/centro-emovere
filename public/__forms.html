<!doctype html>
<html lang="it">
  <head><meta charset="utf-8" /><title>Netlify Forms</title></head>
  <body>
    <!--
      Definizione statica del form per Netlify Forms.
      Netlify legge questo file al deploy e abilita la raccolta dei messaggi
      inviati dal componente ContattiForm (POST su /__forms.html).
    -->
    <form name="contatti" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="tel" name="telefono" />
      <select name="servizio"><option value="">-</option></select>
      <textarea name="messaggio"></textarea>
      <input type="checkbox" name="privacy" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
